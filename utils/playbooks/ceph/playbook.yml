---
- name: Configurar IP estático, hostname, locale e instalar Ceph com iSCSI
  hosts: all
  become: true

  tasks:
    - name: Detectar interface de rede primária
      shell: "ip -o -4 route show to default | awk '{print $5}'"
      register: iface_raw
      changed_when: false

    - name: Definir interface de rede
      set_fact:
        iface: "{{ iface_raw.stdout }}"

    - name: Definir variáveis do host
      set_fact:
        new_ip: "{{ hostvars[inventory_hostname].new_ip }}"
        gateway: "{{ hostvars['localhost'].gateway | default('192.168.122.1') }}"
        netmask: "{{ hostvars['localhost'].netmask | default('24') }}"
        dns_servers: "{{ hostvars['localhost'].dns_servers | default(['8.8.8.8', '1.1.1.1']) }}"

    - name: Desabilitar netplan gerado pelo cloud-init
      copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        content: "network: {config: disabled}\n"

    - name: Limpar configurações netplan existentes
      file:
        path: /etc/netplan
        state: absent

    - name: Recriar diretório netplan limpo
      file:
        path: /etc/netplan
        state: directory
        mode: '0755'

    - name: Criar arquivo netplan com IP estático
      copy:
        dest: /etc/netplan/01-netcfg.yaml
        content: |
          network:
            version: 2
            ethernets:
              {{ iface }}:
                dhcp4: false
                addresses: [{{ new_ip }}/{{ netmask }}]
                routes:
                  - to: default
                    via: {{ gateway }}
                nameservers:
                  addresses: {{ dns_servers }}
        mode: '0600'

    - name: Definir hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Atualizar /etc/hosts com todos os IPs e hostnames
      blockinfile:
        path: /etc/hosts
        block: |
          {% for host in groups['all'] %}
          {{ hostvars[host].new_ip }} {{ host }}
          {% endfor %}
        marker: "# {mark} ANSIBLE-CEPH-HOSTS"

    - name: Configurar locale para pt_BR.UTF-8
      locale_gen:
        name: pt_BR.UTF-8
        state: present

    - name: Definir locale padrão
      lineinfile:
        dest: /etc/default/locale
        regexp: '^LANG='
        line: 'LANG=pt_BR.UTF-8'

    - name: Instalar pacotes Ceph com suporte a iSCSI
      apt:
        name:
          - ceph-common
          - lvm2
          - targetcli-fb
          - python3-rados
          - python3-rbd
          - python3-cephfs
          - python3-rgw
          - python3-prettytable
          - python3-configshell-fb
          - python3-rtslib-fb
          - ceph-iscsi
          - htop
          - net-tools
          - vim
          - curl
          - curl 
          - gnupg 
          - lsb-release 
          - ssh 
          - sudo
          - lvm2
          - podman
        update_cache: true
        state: present

    - name: Agendar reboot para 10 segundos depois
      shell: "(sleep 10 && reboot) &"
      async: 1
      poll: 0

    - name: Aplicar netplan (em segundo plano, logo antes do reboot)
      shell: "netplan apply &"
      async: 1
      poll: 0
